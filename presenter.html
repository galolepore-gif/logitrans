<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vista de ponente · LOGITRANS</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/fonts.css">
<style>
:root { --bg: #05070D; --surface: #0B1120; --surface-2: #101830; --line: #1B2540; --line-2: #2A3556; --text: #E8ECF4; --muted: #7D89A8; --dim: #4F5B7A;
  --brand: #FF6B1A; --signal: #3DF5FF; --alert: #FF3B5C; --ok: #2BE38B; --v10: #A78BFA; --v20: #3B82F6; --v30: #FACC15; --v40: #F472B6; --v50: #2BE38B; --v99: #3DF5FF; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font: 16px/1.5 "IBM Plex Sans", system-ui, sans-serif; height: 100vh; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
.mono { font-family: "JetBrains Mono", Consolas, monospace; }
header { display: flex; align-items: center; gap: 22px; padding: 14px 24px; border-bottom: 1px solid var(--line); }
header .logo { font: 900 18px "Unbounded", sans-serif; } header .logo em { font-style: normal; color: var(--brand); }
#timer { font: 800 34px "Unbounded", sans-serif; margin-left: auto; font-variant-numeric: tabular-nums; }
#clock { color: var(--muted); font-size: 13px; }
main { display: grid; grid-template-columns: 1.6fr 1fr; gap: 0; min-height: 0; }
.now { padding: 26px 30px; overflow: auto; border-right: 1px solid var(--line); }
.n { font: 500 12px "JetBrains Mono", monospace; letter-spacing: .26em; color: var(--signal); text-transform: uppercase; }
h1 { font: 800 clamp(28px, 4vw, 48px)/1.05 "Unbounded", sans-serif; margin: 10px 0 14px; }
.who { display: inline-flex; align-items: center; gap: 10px; font-size: 15px; padding: 6px 14px 6px 6px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line-2); }
.who i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 13px sans-serif; font-style: normal; color: #05070D; }
.steps { display: flex; gap: 6px; margin: 18px 0 6px; align-items: center; }
.steps span { width: 34px; height: 6px; border-radius: 3px; background: var(--line-2); }
.steps span.on { background: var(--brand); }
.steps small { margin-left: 8px; color: var(--muted); font-size: 12px; }
ul.say { list-style: none; margin-top: 18px; display: grid; gap: 14px; }
ul.say li { font-size: clamp(17px, 1.6vw, 22px); line-height: 1.45; padding-left: 22px; position: relative; }
ul.say li::before { content: ""; position: absolute; left: 0; top: .6em; width: 8px; height: 8px; border-radius: 2px; background: var(--brand); }
.time { margin-top: 18px; font-size: 12px; color: var(--muted); }
aside { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
.next { padding: 22px 24px; border-bottom: 1px solid var(--line); background: var(--surface); }
.next .n { color: var(--muted); }
.next b { display: block; font: 700 22px "Unbounded", sans-serif; margin: 6px 0 8px; }
.next .who { font-size: 13px; }
.list { overflow: auto; padding: 10px 12px; }
.list button { display: flex; width: 100%; gap: 12px; align-items: center; padding: 7px 10px; border-radius: 8px; border: 0; background: none; color: var(--muted); font: 14px inherit; text-align: left; cursor: pointer; }
.list button:hover { background: var(--surface); color: var(--text); }
.list button.on { background: var(--surface-2); color: var(--text); box-shadow: inset 3px 0 0 var(--brand); }
.list button .mono { font-size: 11px; width: 22px; color: var(--dim); }
.list button i { width: 9px; height: 9px; border-radius: 50%; margin-left: auto; flex: none; }
footer { display: flex; gap: 10px; padding: 12px 24px; border-top: 1px solid var(--line); align-items: center; }
footer button { font: 600 13px "JetBrains Mono", monospace; letter-spacing: .08em; padding: 14px 22px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); color: var(--text); cursor: pointer; text-transform: uppercase; }
footer button.big { background: var(--brand); color: #140700; border-color: var(--brand); flex: 1; max-width: 360px; }
footer button:hover { border-color: var(--signal); }
footer .hint { margin-left: auto; color: var(--dim); font-size: 12px; }
#lost { position: fixed; inset: 0; background: rgba(5, 7, 13, .94); display: none; place-items: center; text-align: center; padding: 30px; z-index: 5; }
#lost.on { display: grid; }
#lost b { font: 800 22px "Unbounded", sans-serif; display: block; margin-bottom: 10px; }
#lost p { color: var(--muted); max-width: 520px; }
@media (max-width: 800px) { main { grid-template-columns: 1fr; } aside { display: none; } }
</style>
</head>
<body>
<header>
  <div class="logo">LOGI<em>TRANS</em> <span class="mono" style="font-size:11px;color:var(--muted);letter-spacing:.2em;font-weight:500">· VISTA DE PONENTE</span></div>
  <span id="clock" class="mono"></span>
  <div id="timer">00:00</div>
</header>
<main>
  <section class="now">
    <div class="n" id="n">--</div>
    <h1 id="title">Esperando la presentación…</h1>
    <div class="who" id="who"></div>
    <div class="steps" id="steps"></div>
    <ul class="say" id="say"></ul>
    <div class="time mono" id="time"></div>
  </section>
  <aside>
    <div class="next"><div class="n">Siguiente</div><b id="next-t">—</b><div class="who" id="next-who"></div></div>
    <div class="list" id="list"></div>
  </aside>
</main>
<footer>
  <button id="prev">Anterior</button>
  <button id="next" class="big">Siguiente</button>
  <button id="black">Negro</button>
  <span class="hint mono">Flechas · Espacio · B pantalla en negro</span>
</footer>
<div id="lost"><div><b>Sin conexión con la presentación</b><p>Esta ventana se abre desde la web con la tecla S. Si cerraste la pestaña principal, volvé a abrirla y pulsá S otra vez.</p></div></div>
<script>
(function () {
  var S = null, op = window.opener;
  function $(s) { return document.querySelector(s); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function send(cmd, extra) { if (!op || op.closed) { $('#lost').classList.add('on'); return; } var m = { lt: 1, type: 'cmd', cmd: cmd }; for (var k in extra || {}) m[k] = extra[k]; op.postMessage(m, '*'); }
  function who(id, team) {
    var t = (team || []).find(function (m) { return m.id === id; });
    if (!t) return id === 'all' ? '<i style="background:var(--muted)">4</i>Todo el equipo' : '';
    return '<i style="background:var(' + t.color + ')">' + t.initial + '</i>' + esc(t.name) + ' · ' + esc(t.role);
  }
  function render() {
    if (!S) return;
    $('#n').textContent = String(S.i + 1).padStart(2, '0') + ' / ' + S.n + (S.active ? '' : ' · (modo scroll)');
    $('#title').textContent = S.title;
    $('#who').innerHTML = who(S.speaker, S.team);
    var st = ''; for (var k = 0; k <= S.steps; k++) st += '<span class="' + (k <= S.step ? 'on' : '') + '"></span>';
    $('#steps').innerHTML = S.steps ? st + '<small class="mono">paso ' + S.step + ' de ' + S.steps + '</small>' : '';
    $('#say').innerHTML = ((S.notes && S.notes.say) || ['Sin notas para este capítulo.']).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('');
    $('#time').textContent = S.notes && S.notes.time ? 'Tiempo orientativo: ' + String(S.notes.time).replace('.', ',') + ' min' : '';
    $('#next-t').textContent = S.next ? S.next.title : 'Fin';
    $('#next-who').innerHTML = S.next ? who(S.next.speaker, S.team) : '';
    var L = $('#list'); L.innerHTML = '';
    (S.all || []).forEach(function (s, i) {
      var t = (S.team || []).find(function (m) { return m.id === s.speaker; });
      var b = document.createElement('button'); b.className = i === S.i ? 'on' : '';
      b.innerHTML = '<span class="mono">' + String(i + 1).padStart(2, '0') + '</span>' + esc(s.title) + '<i style="background:' + (t ? 'var(' + t.color + ')' : 'var(--muted)') + '"></i>';
      b.onclick = function () { send('goto', { i: i }); };
      L.appendChild(b);
    });
    var cur = L.querySelector('.on'); if (cur) cur.scrollIntoView({ block: 'nearest' });
  }
  window.addEventListener('message', function (e) { var d = e.data; if (!d || !d.lt || d.type !== 'state') return; S = d; $('#lost').classList.remove('on'); render(); });
  $('#next').onclick = function () { send('next'); };
  $('#prev').onclick = function () { send('prev'); };
  $('#black').onclick = function () { send('black'); };
  addEventListener('keydown', function (e) {
    if (['ArrowRight', 'ArrowDown', ' ', 'PageDown', 'Enter'].indexOf(e.key) >= 0) { e.preventDefault(); send('next'); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].indexOf(e.key) >= 0) { e.preventDefault(); send('prev'); }
    else if (e.key.toLowerCase() === 'b') send('black');
  });
  setInterval(function () {
    var d = new Date(); $('#clock').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    if (S && S.t0) { var s = Math.floor((Date.now() - S.t0) / 1000); $('#timer').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
    if (op && op.closed) $('#lost').classList.add('on');
  }, 1000);
  if (!op) $('#lost').classList.add('on'); else send('hello');
})();
</script>
</body>
</html>
